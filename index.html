<script>
/* Skip rules run before anything paints.
   ?intro forces the intro (replays, tests). Otherwise bots / link previews, data-saver & 2G connections
   and returning visitors (localStorage helio:intro-seen) go straight to the episodes. */
(function () {
  var q = new URLSearchParams(location.search), force = q.has('intro') || q.has('hour');
  var bot = /bot\b|bot\/|crawl|spider|slurp|archiver|facebookexternalhit|embedly|whatsapp|vkshare|lighthouse|pagespeed|prerender|inspectiontool|semrush|ahrefs|bytespider|preview/i.test(navigator.userAgent);
  var c = navigator.connection, slow = !!(c && (c.saveData || /(^|-)2g$/.test(c.effectiveType || '')));
  var seen = null; try { seen = localStorage.getItem('helio:intro-seen'); } catch (e) {}
  window.__helioGo = function (why) {
    try { sessionStorage.setItem('helio:skip', why); } catch (e) {}
    location.replace('episodes.html');
  };
  if (!force && (bot || slow || seen)) {
    document.documentElement.className = 'skipping';
    window.__helioGo(bot ? 'bot' : slow ? 'slow' : 'returning');
  }
})();
</script>
